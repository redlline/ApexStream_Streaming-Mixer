<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=150,initial-scale=1">
<title>Countdown Banner</title>
<style>
  :root{
    --w:1920px;
    --h:150px;
    --accent:#f7d35c;
    --accent2:#35d2ff;
    --text:#ffffff;
    --muted:rgba(255,255,255,.72);
    --panel:rgba(10,14,24,.78);
    --line:rgba(255,255,255,.18);
  }
  *{box-sizing:border-box}
  html,body{
    width:var(--w);
    height:var(--h);
    margin:0;
    overflow:hidden;
    background:transparent;
    font-family:Arial, Helvetica, sans-serif;
    color:var(--text);
  }
  .stage{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px 42px;
  }
  .bar{
    width:100%;
    height:112px;
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:34px;
    padding:14px 26px 14px 34px;
    border:1px solid var(--line);
    border-radius:8px;
    background:
      linear-gradient(90deg, rgba(53,210,255,.18), transparent 32%),
      linear-gradient(270deg, rgba(247,211,92,.18), transparent 34%),
      var(--panel);
    box-shadow:0 18px 46px rgba(0,0,0,.35);
  }
  .left{
    min-width:0;
    display:flex;
    align-items:center;
    gap:24px;
  }
  .mark{
    width:10px;
    height:78px;
    border-radius:4px;
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    box-shadow:0 0 18px rgba(53,210,255,.35);
    flex:0 0 auto;
  }
  .copy{
    min-width:0;
  }
  .eyebrow{
    font-size:23px;
    line-height:1;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:0;
    font-weight:700;
    margin-bottom:9px;
    white-space:nowrap;
  }
  .title{
    font-size:42px;
    line-height:1.05;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .sub{
    margin-top:6px;
    font-size:20px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .timer{
    min-width:448px;
    height:86px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    align-items:center;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(0,0,0,.35);
    overflow:hidden;
  }
  .unit{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-left:1px solid rgba(255,255,255,.12);
  }
  .unit:first-child{border-left:none}
  .num{
    font:800 49px/1 "Arial", sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .lbl{
    margin-top:3px;
    font-size:13px;
    color:var(--muted);
    text-transform:uppercase;
    font-weight:700;
  }
  .done .timer{
    grid-template-columns:1fr;
  }
  .done .unit{display:none}
  .done .unit:first-child{display:flex}
  .done .num{font-size:34px;color:var(--accent)}
  .done .lbl{display:none}
</style>
</head>
<body>
<div class="stage">
  <div class="bar" id="bar">
    <div class="left">
      <div class="mark"></div>
      <div class="copy">
        <div class="eyebrow" id="eyebrow"></div>
        <div class="title" id="title"></div>
        <div class="sub" id="subtitle"></div>
      </div>
    </div>
    <div class="timer">
      <div class="unit"><div class="num" id="hh">00</div><div class="lbl">час</div></div>
      <div class="unit"><div class="num" id="mm">00</div><div class="lbl">мин</div></div>
      <div class="unit"><div class="num" id="ss">00</div><div class="lbl">сек</div></div>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  eyebrow: "До начала трансляции",
  title: "Матч начнется скоро",
  subtitle: "Оставайтесь с нами",

  // Вариант 1: отсчет N секунд от момента появления шаблона.
  durationSeconds: 300,

  // Вариант 2: точное время. Если заполнено, durationSeconds игнорируется.
  // Формат: "2026-07-05T20:00:00+05:00"
  targetTime: "",

  finishedText: "Начинаем",
  finishedSubtitle: "Приятного просмотра"
};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const startTs = Date.now();
const targetTs = CONFIG.targetTime
  ? new Date(CONFIG.targetTime).getTime()
  : startTs + CONFIG.durationSeconds * 1000;

$("eyebrow").textContent = CONFIG.eyebrow;
$("title").textContent = CONFIG.title;
$("subtitle").textContent = CONFIG.subtitle;

function tick(){
  const left = Math.max(0, Math.ceil((targetTs - Date.now()) / 1000));
  if(left <= 0){
    document.body.classList.add("done");
    $("hh").textContent = CONFIG.finishedText;
    $("title").textContent = CONFIG.finishedText;
    $("subtitle").textContent = CONFIG.finishedSubtitle;
    return;
  }
  const h = Math.floor(left / 3600);
  const m = Math.floor((left % 3600) / 60);
  const s = left % 60;
  $("hh").textContent = pad(h);
  $("mm").textContent = pad(m);
  $("ss").textContent = pad(s);
  requestAnimationFrame(()=>setTimeout(tick, 200));
}
tick();
</script>
</body>
</html>
